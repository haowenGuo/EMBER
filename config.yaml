project:
  name: EMBER
  full_name: Emergent Multi-turn Bias Evaluation and Mitigation in Adversarial Dialogues
  default_language: zh-CN

dataset:
  default_path: Dataset/changemyview_persuasion_kto.jsonl
  topic_id_prefix: cmv_
  evaluation_rounds: [0, 1, 3, 5, 10]

evaluation:
  bias_dimensions:
    - political
    - gender
    - ethnic_cultural
    - age
    - religion
    - disability
  level_to_score:
    None: 0
    Low: 1
    Moderate: 2
    High: 3

harness:
  stages:
    - input_parse
    - memory_read
    - retrieval
    - planning
    - tool_result
    - draft_response
    - final_response
